# Цвета и true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# Буфер обмена
set -g set-clipboard on

# Мышь
set -g mouse on

# История
set -g history-limit 50000

# Меньше задержка для Esc, полезно в vim/nvim
set -g escape-time 0

# Нумерация окон и панелей с 1
set -g base-index 1
setw -g pane-base-index 1

# При закрытии окна перенумеровывать оставшиеся
set -g renumber-windows on

# Vi-режим для копирования
setw -g mode-keys vi


# Новые окна и панели в текущей директории
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Быстрая перезагрузка конфига
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ----------------------------------------
# Красивый статус-бар в стиле Catppuccin Mocha
# ----------------------------------------

set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 60
set -g status-right-length 120

set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "

set -g status-right "#[fg=#6c7086] %Y-%m-%d %H:%M #[fg=#1e1e2e,bg=#a6e3a1,bold] #h "

setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#f5c2e7,bold] #I:#W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#f5c2e7,fg=#1e1e2e"

# ----------------------------------------
# Плагины через TPM
# ----------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Автосохранение и восстановление сессий
set -g @continuum-restore 'on'

# TPM должен быть последней строкой
run '~/.tmux/plugins/tpm/tpm'
